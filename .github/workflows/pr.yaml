name: PR

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-core:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

  tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: run
        run: "build/tests/debug/test.exe"

  build-python:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DBUILD_PYTHON=ON

      - name: Build
        run: cmake --build build

  build-csharp:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: dotnet build bindings/csharp/csharp.csproj
